name: CityOps scheduled ingestion
on:
  workflow_dispatch:
  schedule:
    - cron: '20 8 * * *'

concurrency:
  group: cityops-ingestion
  cancel-in-progress: false

jobs:
  ingest:
    if: vars.CITYOPS_INGEST_ENABLED == 'true'
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.CITYOPS_DATABASE_URL }}
      NYC_311_APP_TOKEN: ${{ secrets.NYC_311_APP_TOKEN }}
      INGEST_START_DATE: ${{ vars.CITYOPS_INGEST_START_DATE }}
      INGEST_END_DATE: ${{ vars.CITYOPS_INGEST_END_DATE }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - run: npm ci --prefix apps/api
      - run: npm run ingest --prefix apps/api
