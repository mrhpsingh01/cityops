services:
  db:
    image: postgis/postgis:16-3.4-alpine
    environment:
      POSTGRES_DB: cityops
      POSTGRES_USER: cityops
      POSTGRES_PASSWORD: cityops_dev
    ports:
      - "${DB_HOST_PORT:-5432}:5432"
    volumes:
      - cityops_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cityops -d cityops"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: ../apps/api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://cityops:cityops_dev@db:5432/cityops
      PORT: 4000
      FRONTEND_URL: http://localhost:${WEB_PORT:-3000}
      NYC_311_APP_TOKEN: ${NYC_311_APP_TOKEN:-}
    ports:
      - "${API_HOST_PORT:-4000}:4000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/health').then(r => { if (!r.ok) process.exit(1); return r.json(); }).then(body => { if (body.database !== 'ready') process.exit(1); }).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    command: ["node", "scripts/bootstrap.js"]
  web:
    build:
      context: ../apps/web
      args:
        NEXT_PUBLIC_API_URL: http://localhost:${API_HOST_PORT:-4000}
    environment:
      API_INTERNAL_URL: http://api:4000
      NEXT_PUBLIC_API_URL: http://localhost:${API_HOST_PORT:-4000}
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
  seed:
    profiles: ["seed"]
    build: ../apps/api
    environment:
      DATABASE_URL: postgres://cityops:cityops_dev@db:5432/cityops
    depends_on:
      db:
        condition: service_healthy
    command: ["npm", "run", "seed:postgis"]
  ingest:
    profiles: ["ingest"]
    build: ../apps/api
    environment:
      DATABASE_URL: postgres://cityops:cityops_dev@db:5432/cityops
      NYC_311_APP_TOKEN: ${NYC_311_APP_TOKEN:-}
      INGEST_START_DATE: ${INGEST_START_DATE:-2025-01-01}
      INGEST_END_DATE: ${INGEST_END_DATE:-2025-02-01}
    depends_on:
      db:
        condition: service_healthy
    command: ["npm", "run", "ingest"]
volumes:
  cityops_pg:
